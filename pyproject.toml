[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval Augmented Generation"
readme = "README.md"
authors = [
    { name = "haryandr" }
]
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.14",
    "fire>=0.7.1",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "pydantic>=2.14.1",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "flake8-docstrings>=1.7.0",
    "mypy>=2.4.0",
    "types-tqdm>=4.70.0.20261102",
]

[tool.mypy]
exclude = [
    "data/",
    ".venv/"
]

[[tool.mypy.overrides]]
module = [
    "bm25s",
    "fire"
]
ignore_missing_imports = true
